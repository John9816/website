# Include inside the hi.751152.xyz server block. Installer files live outside
# frontend releases so a website deploy or rollback cannot remove downloads.
location ^~ /downloads/music/ {
    alias /opt/website/downloads/music/;
    types { }
    default_type application/octet-stream;
    autoindex off;
    add_header Content-Disposition "attachment" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=86400";
}
