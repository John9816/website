<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="referrer" content="no-referrer" />
<title>服务器监控 · 751152</title>
<style>
  :root {
    --bg: #0f1419; --panel: #171e26; --panel-2: #1d2630; --line: #2a3542;
    --text: #e6edf3; --dim: #8b98a5; --accent: #4dd4ac; --good: #4dd4ac;
    --warn: #f0b429; --bad: #f0685c; --blue: #63a8ff;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; color: var(--text); background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 60px; }
  header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; margin-bottom: 22px; }
  h1 { font-size: 22px; margin: 0; font-weight: 650; letter-spacing: .3px; }
  h1 .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--good); margin-right: 10px; box-shadow: 0 0 0 4px rgba(77,212,172,.15); }
  .meta { color: var(--dim); font-size: 12.5px; text-align: right; }
  .meta b { color: var(--text); font-weight: 600; }
  .actions { display: flex; gap: 8px; align-items: center; }
  button, select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 9px; padding: 7px 12px; font-size: 13px; cursor: pointer;
    font-family: inherit; transition: background .15s, border-color .15s;
  }
  button:hover, select:hover { background: #26313d; border-color: #3a4858; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px 18px; position: relative; overflow: hidden;
  }
  .card .label { color: var(--dim); font-size: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; }
  .card .value { font-size: 28px; font-weight: 680; letter-spacing: .5px; font-variant-numeric: tabular-nums; }
  .card .value small { font-size: 14px; color: var(--dim); font-weight: 500; margin-left: 3px; }
  .card .sub { color: var(--dim); font-size: 11.5px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .bar { height: 4px; background: var(--line); border-radius: 4px; margin-top: 12px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .5s ease, background .3s; }
  .warn .value { color: var(--warn); } .warn .bar > i { background: var(--warn); }
  .bad .value { color: var(--bad); } .bad .bar > i { background: var(--bad); }
  .section { margin-top: 22px; }
  .section h2 { font-size: 15px; margin: 0 0 12px; font-weight: 620; color: var(--text); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .two-col { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
  .chart-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tabs button { padding: 5px 10px; font-size: 12px; background: transparent; border-color: transparent; color: var(--dim); }
  .tabs button.on { background: var(--panel-2); color: var(--text); border-color: var(--line); }
  canvas { width: 100%; height: 240px; display: block; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--dim); margin-top: 10px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 9px 4px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  td.k { color: var(--dim); }
  td.v { text-align: right; font-variant-numeric: tabular-nums; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
  .pill.down::before { background: var(--bad); }
  .pill.unknown::before { background: var(--dim); }
  .pill.down { color: var(--bad); }
  .footer { color: var(--dim); font-size: 11.5px; text-align: center; margin-top: 26px; }
  .banner { background: rgba(240,104,92,.12); border: 1px solid rgba(240,104,92,.35); color: #ffb3ac;
    border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; font-size: 13px; display: none; }
  .banner.show { display: block; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><span class="dot" id="hdot"></span>服务器监控</h1>
      <div class="meta" style="text-align:left;margin-top:6px">
        ECS <b id="ip">—</b> · 2 核 · 3 Mbps · 运行时长 <b id="uptime">—</b>
      </div>
    </div>
    <div class="actions">
      <span class="meta" id="updated">加载中…</span>
      <select id="refresh">
        <option value="5000">5 秒刷新</option>
        <option value="10000">10 秒刷新</option>
        <option value="30000">30 秒刷新</option>
        <option value="0">暂停</option>
      </select>
      <button id="now">立即刷新</button>
    </div>
  </header>

  <div class="banner" id="banner"></div>

  <div class="grid" id="cards">
    <div class="card" id="c-cpu"><div class="label"><span>CPU 使用率</span><span id="cpu-cores">—</span></div><div class="value" id="v-cpu">—</div><div class="bar"><i id="b-cpu"></i></div><div class="sub" id="s-cpu">—</div></div>
    <div class="card" id="c-mem"><div class="label"><span>内存</span><span id="mem-total">—</span></div><div class="value" id="v-mem">—</div><div class="bar"><i id="b-mem"></i></div><div class="sub" id="s-mem">—</div></div>
    <div class="card" id="c-disk"><div class="label"><span>磁盘 /</span><span id="disk-total">—</span></div><div class="value" id="v-disk">—</div><div class="bar"><i id="b-disk"></i></div><div class="sub" id="s-disk">—</div></div>
    <div class="card" id="c-net"><div class="label"><span>网络流量</span><span id="net-iface">—</span></div><div class="value" id="v-net">—</div><div class="sub" id="s-net">入 / 出 Mbps</div></div>
  </div>

  <div class="section two-col">
    <div class="panel">
      <div class="chart-head">
        <h2 style="margin:0">历史趋势</h2>
        <div class="tabs" id="metric-tabs">
          <button data-m="cpu" class="on">CPU</button>
          <button data-m="mem">内存</button>
          <button data-m="net">网络</button>
          <button data-m="load">负载</button>
        </div>
        <div class="tabs" id="hours-tabs">
          <button data-h="1">1h</button>
          <button data-h="6" class="on">6h</button>
          <button data-h="24">24h</button>
          <button data-h="48">48h</button>
        </div>
      </div>
      <canvas id="chart"></canvas>
      <div class="legend" id="legend"></div>
    </div>
    <div class="panel">
      <h2>服务健康</h2>
      <table id="svc-table"><tbody><tr><td class="k">检测中…</td></tr></tbody></table>
    </div>
  </div>

  <div class="section two-col">
    <div class="panel">
      <h2>包体积</h2>
      <table><tbody id="pkg-body"><tr><td class="k">检测中…</td></tr></tbody></table>
    </div>
    <div class="panel">
      <h2>发布信息</h2>
      <table><tbody id="rel-body"><tr><td class="k">检测中…</td></tr></tbody></table>
    </div>
  </div>

  <div class="footer">数据来源：ECS 本机 /proc 与 systemd · 只读指标 · 自动刷新</div>
</div>

<script>
const $ = id => document.getElementById(id);
let metric = 'cpu', hours = 6, timer = null;
const TH = { cpu: 80, mem: 85, disk: 85, load: 1.6 };

function lvl(v, key){ const t=TH[key]||Infinity; return v >= t ? (v >= t*1.15 ? 'bad' : 'warn') : ''; }
function pct(v){ return (v==null||isNaN(v)) ? '—' : Number(v).toFixed(1) + '%'; }

function setCard(id, val, bar, sub, ratio, level){
  const el = $(id);
  el.classList.remove('warn','bad');
  if (level) el.classList.add(level);
  if (val !== undefined) $( 'v-'+id.replace('c-','') ).innerHTML = val;
  if (bar !== undefined) $( 'b-'+id.replace('c-','') ).style.width = Math.min(100, Math.max(0, ratio||0)) + '%';
  if (sub !== undefined) $( 's-'+id.replace('c-','') ).textContent = sub;
}

async function fetchLive(){
  const r = await fetch('api/live', {cache:'no-store'});
  if (!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

function renderLive(d){
  $('ip').textContent = d.ip || '—';
  $('uptime').textContent = d.uptime || '—';
  $('updated').innerHTML = '更新于 ' + d.time;
  $('hdot').style.background = 'var(--good)';

  $('cpu-cores').textContent = (d.cores||'—') + ' 核';
  const lv = d.load||{};
  const loadTxt = '负载 '+(lv.one!=null?Number(lv.one).toFixed(2):'—')+' / '+(lv.five!=null?Number(lv.five).toFixed(2):'—');
  setCard('c-cpu', pct(d.cpu), d.cpu, loadTxt, d.cpu, lvl(d.cpu,'cpu'));

  const m = d.mem||{};
  $('mem-total').textContent = '共 '+(m.total_mb??'—')+' MB';
  setCard('c-mem', pct(m.percent), m.percent,
    '已用 '+(m.used_mb??'—')+' MB · 可用 '+(m.available_mb??'—')+' MB', m.percent, lvl(m.percent,'mem'));

  const dk = d.disk||{};
  $('disk-total').textContent = '共 '+(dk.total_gb??'—')+' GB';
  setCard('c-disk', pct(dk.percent), dk.percent,
    '已用 '+(dk.used_gb??'—')+' GB · 剩余 '+(dk.free_gb??'—')+' GB', dk.percent, lvl(dk.percent,'disk'));

  $('net-iface').textContent = d.iface||'—';
  $('v-net').innerHTML = (d.net?.rx_mbps??0).toFixed(2)+'<small>↓</small> '+(d.net?.tx_mbps??0).toFixed(2)+'<small>↑</small>';
  $('s-net').textContent = '入 / 出 Mbps · 上限约 3 Mbps';

  // 负载也纳入告警横幅
  const loadHigh = (d.load?.one||0) > (d.cores||2) * 1.6;
  const alerts = [];
  if (d.cpu >= TH.cpu) alerts.push('CPU '+pct(d.cpu));
  if ((m.percent||0) >= TH.mem) alerts.push('内存 '+pct(m.percent));
  if ((dk.percent||0) >= TH.disk) alerts.push('磁盘 '+pct(dk.percent));
  if (loadHigh) alerts.push('负载 '+(d.load.one.toFixed(2)));
  const down = Object.entries(d.services||{}).filter(([k,v]) => !v.active);
  if (down.length) alerts.push('服务异常: '+down.map(x=>x[0]).join('、'));
  const banner = $('banner');
  if (alerts.length){ banner.textContent = '⚠ '+alerts.join(' · '); banner.classList.add('show'); }
  else banner.classList.remove('show');

  // 服务表
  const rows = Object.entries(d.services||{}).map(([name, s]) => {
    const down = !s.active;
    const http = s.http ? ' · HTTP '+s.http : '';
    return `<tr><td class="k">${name}</td><td class="v"><span class="pill ${down?'down':''}">${down?'异常':'运行'}${http}</span></td></tr>`;
  }).join('');
  $('svc-table').querySelector('tbody').innerHTML = rows || '<tr><td class="k">无数据</td></tr>';

  // 包体积
  const p = d.packages||{};
  const pkgRows = [];
  if (p.frontend && !p.frontend.error) pkgRows.push(`<tr><td class="k">前端 dist</td><td class="v">${p.frontend.size}</td></tr>`);
  if (p.backend && !p.backend.error) pkgRows.push(`<tr><td class="k">后端 jar</td><td class="v">${p.backend.size}</td></tr>`);
  if (p.backend?.built_at) pkgRows.push(`<tr><td class="k">jar 构建时间</td><td class="v">${p.backend.built_at}</td></tr>`);
  $('pkg-body').innerHTML = pkgRows.join('') || '<tr><td class="k">无数据</td></tr>';

  // 发布信息（接口中 release 嵌在 packages 内）
  const rel = (d.packages && d.packages.release) || {};
  const relRows = [];
  if (rel.version) relRows.push(`<tr><td class="k">版本</td><td class="v">v${rel.version} (${rel.build??'—'})</td></tr>`);
  if (rel.published_at) relRows.push(`<tr><td class="k">清单更新</td><td class="v">${rel.published_at}</td></tr>`);
  if (rel.current_release) relRows.push(`<tr><td class="k">当前 release</td><td class="v" style="font-size:11px">${rel.current_release}</td></tr>`);
  $('rel-body').innerHTML = relRows.join('') || '<tr><td class="k">无数据</td></tr>';
}

function drawChart(points){
  const cv = $('chart'), ctx = cv.getContext('2d');
  const W = cv.clientWidth, H = cv.clientHeight, dpr = window.devicePixelRatio||1;
  cv.width = W*dpr; cv.height = H*dpr; ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  const pad = {l:38,r:12,t:12,b:24};
  const cw = W-pad.l-pad.r, ch = H-pad.t-pad.b;
  if (!points || points.length < 2){
    ctx.fillStyle = '#8b98a5'; ctx.font = '13px sans-serif';
    ctx.fillText('历史数据采集中，稍后自动显示…', pad.l, H/2);
    return;
  }
  const series = {
    cpu:  {key:'cpu', color:'#4dd4ac', max:100, fmt:v=>v.toFixed(0)+'%'},
    mem:  {key:'mem', color:'#63a8ff', max:100, fmt:v=>v.toFixed(0)+'%'},
    net:  {key:'rx',  color:'#4dd4ac', max:null, fmt:v=>v.toFixed(1), key2:'tx', color2:'#f0b429'},
    load: {key:'load',color:'#b48cff', max:null, fmt:v=>v.toFixed(2)},
  };
  const cfg = series[metric];
  let max = cfg.max;
  if (max == null){
    max = 0;
    points.forEach(p=>{
      const v = cfg.key2 ? Math.max(p[cfg.key]||0, p[cfg.key2]||0) : (p[cfg.key]||0);
      if (v>max) max=v;
    });
    max = Math.max(max*1.15, metric==='load'?1:0.5);
  }
  // 网格
  ctx.strokeStyle = '#2a3542'; ctx.lineWidth = 1; ctx.font = '11px sans-serif'; ctx.fillStyle = '#8b98a5';
  for (let i=0;i<=4;i++){
    const y = pad.t + ch*i/4;
    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke();
    ctx.fillText((max*(4-i)/4).toFixed(max>=10?0:1), 4, y+3);
  }
  const x0 = points[0].ts, x1 = points[points.length-1].ts, span = Math.max(1,x1-x0);
  const X = p => pad.l + (p.ts-x0)/span*cw;
  const Y = v => pad.t + ch*(1 - Math.min(1,Math.max(0,v/max)));
  const line = (key,color) => {
    ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 1.8;
    points.forEach((p,i)=>{ const x=X(p), y=Y(p[key]||0); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
    ctx.stroke();
  };
  line(cfg.key, cfg.color);
  if (cfg.key2) line(cfg.key2, cfg.color2);
  // 时间轴
  ctx.fillStyle = '#8b98a5';
  const fmtT = ts => { const d=new Date(ts*1000); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
  ctx.fillText(fmtT(x0), pad.l, H-6);
  ctx.fillText(fmtT(x1), W-pad.r-34, H-6);

  const legend = cfg.key2
    ? `<span><i style="background:${cfg.color}"></i>入站 rx</span><span><i style="background:${cfg.color2}"></i>出站 tx</span>`
    : `<span><i style="background:${cfg.color}"></i>${metric==='load'?'1 分钟负载':metric}</span>`;
  $('legend').innerHTML = legend;
}

async function fetchHistory(){
  const r = await fetch('api/history?hours='+hours, {cache:'no-store'});
  if (!r.ok) return;
  const d = await r.json();
  drawChart(d.points||[]);
}

async function refresh(){ await fetchLive().then(renderLive).catch(e=>{ $('updated').textContent='连接失败'; }); await fetchHistory(); }
function schedule(){
  if (timer) clearInterval(timer);
  const ms = +$('refresh').value;
  if (ms>0) timer = setInterval(refresh, ms);
}

$('refresh').addEventListener('change', schedule);
$('now').addEventListener('click', refresh);
$('metric-tabs').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  metric = b.dataset.m;
  [...$('metric-tabs').children].forEach(x=>x.classList.toggle('on', x===b));
  fetchHistory();
});
$('hours-tabs').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  hours = +b.dataset.h;
  [...$('hours-tabs').children].forEach(x=>x.classList.toggle('on', x===b));
  fetchHistory();
});

refresh(); schedule();
</script>
</body>
</html>
